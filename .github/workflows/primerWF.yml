name: 'Node'


on:

  push:


jobs:
  

  run:
  
    runs-on: ubuntu-latest

    steps:
    
      - name: "Hola mundo"
        run: echo "Hola mundito"

      - name: "Checkout"
        uses: actions/checkout@v7

#Copia los archivos del repositorio dentro de la carpeta de trabajo predeterminada del ejecutor ($GITHUB_WORKSPACE), la cual inicia completamente vacía 
#workflow (como compilar, pasar pruebas unitarias o hacer un despliegue) no tendría acceso a ningún archivo de tu proyecto.

      - name: "Instalamos depencias"
        run: npm ci

      - name: "Set up docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log to Dockerhub"
        uses: docker/login-action@v3
        with:
          username : ${{secrets.DOCKERHUB_USERNAME}}
          password : ${{secrets.DOCKERHUB_TOKEN}}

      - name: "Build and push"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true