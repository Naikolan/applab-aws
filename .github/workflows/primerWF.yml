name: 'Node'


on:

  push:


jobs:
  

  run:
  
    runs-on: ubuntu-latest

    steps:
    
      - name: "Hola mundo"
        run: echo "Hola mundito"

      - name: "Checkout"
        uses: actions/checkout@v7

#Copia los archivos del repositorio dentro de la carpeta de trabajo predeterminada del ejecutor ($GITHUB_WORKSPACE), la cual inicia completamente vacía 
#workflow (como compilar, pasar pruebas unitarias o hacer un despliegue) no tendría acceso a ningún archivo de tu proyecto.

      - name: "Instalamos depencias"
        run: npm ci

  
      - name: "Set up docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Log to Dockerhub"
        uses: docker/login-action@v3
        with:
          username : ${{ secrets.DOCKERHUB_USERNAME }}
          password : ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Extract Metadata (tags, labels)"
        id: meta 
        uses: docker/metadata-action@v5
        with:
          images: ${{env.IMAGE_NAME}}
          tags: |
            type=ref, event=branch
            type=sha, prefix=sha-
            type=raw, value=latest,enable=${{github.ref == 'refs/heads/main'}} 

      - name: SonarQube
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: "Build and push"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/node_app:0.0.1
#          labels: ${{steps.meta.outputs.labels}}
#          cache-from: type=gha
#          cache-to: type=gha,mode=max

