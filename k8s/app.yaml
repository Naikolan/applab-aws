apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-express
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-express
  template:
    metadata:
      labels:
        app: node-express
    spec:
      containers:
        - name: node-express
          image: node-express:1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: node-express
  namespace: dev
spec:
  type: NodePort
  selector:
    app: node-express
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080